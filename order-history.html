        <a class="navbar-brand fw-bold" href="index.html">Tea Society</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

<!-- HEADER -->
<header class="text-center py-5">
    <h1 class="fw-bold">Order History</h1>
    <p class="lead">View your event registrations and status</p>
</header>

<!-- MAIN CONTENT -->
<div class="container mb-5">

    <!-- SEARCH -->
    <div class="card shadow p-4 rounded-4">

        <div class="mb-4">
            <input 
                type="text" 
                id="searchInput" 
                class="form-control form-control-lg"
                placeholder="Search by name, email, or event..."
            >
        </div>

        <!-- TABLE -->
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Event</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="ordersTable">
                    <tr>
                        <td colspan="5">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<!-- FOOTER LINKS -->
<div class="text-center pb-4">
    <a href="index.html" class="btn btn-outline-light me-2">Home</a>
    <a href="approval.html" class="btn btn-outline-light">Admin Approval</a>
</div>

<!-- SCRIPT -->
<script>
const API_URL = "https://teasocietyportal.onrender.com/api/orders";
let allOrders = [];

async function loadOrders() {
    const table = document.getElementById("ordersTable");

    try {
        const res = await fetch(API_URL);

        if (!res.ok) throw new Error("API failed");

        const data = await res.json();

        allOrders = data;
        displayOrders(data);

    } catch (error) {
        table.innerHTML = `
            <tr>
                <td colspan="5" class="text-danger fw-bold">
                    Unable to load orders
                </td>
            </tr>
        `;
        console.error(error);
    }
}

function badgeColor(status) {
    if (status === "Approved") return "success";
    if (status === "Rejected") return "danger";
    return "warning";
}

function displayOrders(orders) {
    const table = document.getElementById("ordersTable");

    if (orders.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="5">No orders found</td>
            </tr>
        `;
        return;
    }

    table.innerHTML = "";

    orders.forEach(order => {
        table.innerHTML += `
            <tr>
                <td>${order.orderId || "N/A"}</td>
                <td>${order.fullName || "N/A"}</td>
                <td>${order.email || "N/A"}</td>
                <td>${order.event || "N/A"}</td>
                <td>
                    <span class="badge bg-${badgeColor(order.status)} px-3 py-2">
                        ${order.status || "Pending"}
                    </span>
                </td>
            </tr>
        `;
    });
}

document.getElementById("searchInput").addEventListener("input", function () {
    const value = this.value.toLowerCase();

    const filtered = allOrders.filter(order =>
        (order.fullName || "").toLowerCase().includes(value) ||
        (order.email || "").toLowerCase().includes(value) ||
        (order.event || "").toLowerCase().includes(value)
    );

    displayOrders(filtered);
});

loadOrders();
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
