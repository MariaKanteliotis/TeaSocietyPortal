<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order History - Tea Society</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f0;
    }

    header {
      background: linear-gradient(to right, #2e6f4f, #6aa27a);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #d7e5dc;
    }

    .approved {
      color: green;
      font-weight: bold;
    }

    .declined {
      color: red;
      font-weight: bold;
    }

    .pending {
      color: orange;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>Order History</h1>
  <p>View your event registrations and status</p>
</header>

<div class="container">

  <input 
    type="text" 
    id="searchInput" 
    placeholder="Search orders..."
  />

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Event</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="ordersTable">
      <tr><td colspan="5">Loading...</td></tr>
    </tbody>
  </table>

</div>

<script>
  const API_URL = "https://tea-society-backend.onrender.com/api/orders";

  let allOrders = [];

  async function loadOrders() {
    try {
      const res = await fetch(API_URL);

      if (!res.ok) throw new Error("API not working");

      const data = await res.json();

      allOrders = data;
      displayOrders(data);

    } catch (err) {
      document.getElementById("ordersTable").innerHTML =
        "<tr><td colspan='5'>Error loading orders</td></tr>";
      console.error(err);
    }
  }

  function displayOrders(orders) {
    const table = document.getElementById("ordersTable");

    if (orders.length === 0) {
      table.innerHTML = "<tr><td colspan='5'>No orders found</td></tr>";
      return;
    }

    table.innerHTML = "";

    orders.forEach(order => {
      const row = `
        <tr>
          <td>${order.orderId}</td>
          <td>${order.fullName || "N/A"}</td>
          <td>${order.email || "N/A"}</td>
          <td>${order.event || "N/A"}</td>
          <td class="${order.status}">${order.status}</td>
        </tr>
      `;
      table.innerHTML += row;
    });
  }

  document.getElementById("searchInput").addEventListener("input", function() {
    const value = this.value.toLowerCase();

    const filtered = allOrders.filter(order =>
      (order.fullName || "").toLowerCase().includes(value) ||
      (order.email || "").toLowerCase().includes(value) ||
      (order.event || "").toLowerCase().includes(value)
    );

    displayOrders(filtered);
  });

  loadOrders();
</script>

</body>
</html>
