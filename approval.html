<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Approval Dashboard - Tea Society</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f0;
    }

    header {
      background: linear-gradient(to right, #2e6f4f, #6aa27a);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .buttons {
      margin-top: 10px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      margin-right: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve {
      background: green;
      color: white;
    }

    .decline {
      background: red;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>Admin Approval Dashboard</h1>
  <p>Approve or decline pending orders</p>
</header>

<div class="container" id="ordersContainer">
  Loading...
</div>

<script>

const API_URL = "https://teasocietyportal.onrender.com/api/orders";

async function loadOrders() {
  try {
    const res = await fetch(API_URL);

    if (!res.ok) throw new Error("Server error");

    const orders = await res.json();

    const pending = orders.filter(o => o.status === "pending");

    displayOrders(pending);

  } catch (err) {
    document.getElementById("ordersContainer").innerHTML =
      "<p>Error loading orders</p>";
    console.error(err);
  }
}

function displayOrders(orders) {
  const container = document.getElementById("ordersContainer");

  if (orders.length === 0) {
    container.innerHTML = "<p>No pending orders 🎉</p>";
    return;
  }

  container.innerHTML = "";

  orders.forEach(order => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "order-" + order.orderId;

    card.innerHTML = `
      <h3>${order.fullName || "No Name"}</h3>
      <p><strong>Email:</strong> ${order.email || "N/A"}</p>
      <p><strong>Event:</strong> ${order.event || "N/A"}</p>

      <div class="buttons">
        <button class="approve" onclick="approveOrder(${order.orderId})">
          Approve
        </button>
        <button class="decline" onclick="declineOrder(${order.orderId})">
          Decline
        </button>
      </div>
    `;

    container.appendChild(card);
  });
}

async function approveOrder(id) {
  try {
    const res = await fetch(`${API_URL}/${id}/approve`, {
      method: "PUT"
    });

    if (!res.ok) throw new Error("Approve failed");

    // remove from UI instantly
    document.getElementById("order-" + id).remove();

  } catch (err) {
    alert("Error approving order");
    console.error(err);
  }
}

async function declineOrder(id) {
  try {
    const res = await fetch(`${API_URL}/${id}/decline`, {
      method: "PUT"
    });

    if (!res.ok) throw new Error("Decline failed");

    // remove from UI instantly
    document.getElementById("order-" + id).remove();

  } catch (err) {
    alert("Error declining order");
    console.error(err);
  }
}

// Load on page start
loadOrders();

</script>

</body>
</html>
